<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClanRest Gestión</title>
<link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}">
</div>
<main class="container-fluid content">
<div class="page-title">
<small>CATERING Y EVENTOS</small>
<h1>Clientes</h1>
</div>
<a class="btn btn-primary mb-3" th:href="@{/clients/new}">Nuevo cliente</a>
<form class="mb-3">
<label for="search">Buscar por nombre</label>
<input id="search" name="search" th:value="${search}">
<button class="btn btn-light">Buscar</button>
</form>
<div class="table-responsive panel">
<table class="table table-hover">
<thead>
<tr>
<th>Nombre</th>
<th>Documento</th>
<th>Teléfono</th>
<th>Activo</th>
<th>Acción</th>
</tr>
</thead>
<tbody>
<tr th:each="c : ${clients}">
<td th:text="${c.name}">
</td>
<td th:text="${c.documentNumber}">
</td>
<td th:text="${c.phone}">
</td>
<td th:text="${c.active ? 'Activo' : 'Inactivo'}">
</td>
<td>
<a class="btn btn-sm btn-outline-primary" th:href="@{/clients/{id}(id=${c.id})}">Editar e historial</a>
</td>
</tr>
</tbody>
</table>
</div>
</main>
<footer class="content text-muted">ClanRest Gestión · Proyecto académico · Datos demo ficticios</footer>
</body>
</html>
